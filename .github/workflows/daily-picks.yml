name: Picks y alertas

on:
  # Cada hora. El job tarda ~12 s, asi que 24 corridas diarias (~5 min)
  # entran de sobra en los minutos de Actions de un repo publico.
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: picks-horario
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correr tests del motor
        working-directory: server
        run: node --test engine/*.test.mjs providers/*.test.mjs

      # Cuotas de las ligas no europeas. Si el secret no esta, o la cuota
      # mensual del plan se agoto, el paso falla sin tumbar el workflow:
      # la calibracion europea sigue siendo valida.
      - name: Preparar .env si hay secrets
        working-directory: server
        env:
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
        run: |
          if [ -n "$SPORTAPI_KEY" ]; then
            {
              echo "SPORTAPI_KEY=$SPORTAPI_KEY"
              echo "SPORTAPI_HOST=sportapi7.p.rapidapi.com"
            } > .env
            echo "secret disponible"
          else
            echo "sin secret SPORTAPI_KEY: se usara solo la calibracion europea"
          fi

      - name: Refrescar cuotas de las ligas de america (opcional)
        working-directory: server
        continue-on-error: true
        run: node --env-file=.env scripts/descargar-odds-sportapi.mjs 3

      - name: Generar picks y detectar movimiento
        working-directory: server
        run: node scripts/daily.mjs

      - name: Commit si hubo cambios materiales
        working-directory: server
        run: |
          if node scripts/publicar-si-cambia.mjs; then
            cd ..
            git config user.name  'picks-bot'
            git config user.email 'picks-bot@users.noreply.github.com'
            git add server/public/picks.json server/data/picks-anterior.json
            git commit -m "picks $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "nada que publicar"
          fi